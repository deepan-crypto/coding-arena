# Nginx Reverse Proxy Configuration
# This proxies API requests to the Node.js backend, and routes the frontend app.
# The Node.js backend handles communication with Judge0 (which runs internally).

server {
    listen 80;
    server_name your_domain.com; # Replace with your domain

    # Rate limiting zone definitions (place these in nginx.conf http block if needed globally)
    # limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # Frontend (React application)
    location / {
        root /var/www/html/client/dist;
        try_files $uri $uri/ /index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
    }

    # Node.js backend API
    location /api/ {
        # Optional rate limiting for API
        # limit_req zone=mylimit burst=20 nodelay;

        proxy_pass http://localhost:5000/; # Adjust if Node.js runs on a different port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Forward client IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Explicitly block access to the compiler API if you want to force rate limits differently
    # But since it's behind /api/, it inherits the above rules.
}
